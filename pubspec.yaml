name: pro_scanner
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  google_mlkit_document_scanner: ^0.4.1
  pdf: ^3.12.0
  open_filex: ^4.5.0
  share_plus: ^13.1.0
  flutter_speed_dial: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  # Android 8+ için logonun arkasına renk ekler (isteğe bağlı)
